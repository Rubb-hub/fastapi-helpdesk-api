[project]
name = "helpdesk-api"
version = "1.0.0"
description = "REST HelpDesk API built with FastAPI, PostgreSQL and SQLAlchemy."
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra"

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"